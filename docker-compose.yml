# DX-OS Tầng 1 (Headless Core) - chỉ cung cấp dịch vụ qua REST API, không có UI nghiệp vụ.
# Biến cấu hình lấy từ file .env (bản sao của .env.example).

name: dxos-tier1

networks:
  dxos-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  etcd-data:

services:
  # ---- Data: SQL ----
  postgres:
    image: postgres:16
    container_name: dxos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432" # chỉ máy chủ này; không mở ra mạng
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dxos-net

  # ---- Data: Object Storage ----
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 # = pgsty/minio:latest ngày 2026-11-13
    container_name: dxos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # OIDC với Keycloak: đổi JWT lấy thông tin tạm thời qua STS AssumeRoleWithWebIdentity.
      # Claim "policy" (realm role của Keycloak) ánh xạ sang policy của MinIO.
      MINIO_IDENTITY_OPENID_ENABLE: "on"
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
      MINIO_IDENTITY_OPENID_SCOPES: openid
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Keycloak SSO
      MINIO_IDENTITY_OPENID_REDIRECT_URI: http://localhost:${MINIO_CONSOLE_PORT}/oauth_callback
      # CORS do MinIO xử lý (không thêm plugin cors ở route S3 để tránh trùng header) cho frontend Tầng 2
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001" # console MinIO chỉ máy chủ này (không qua cổng gác nên không được mở ra mạng)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dxos-net

  # ---- Identity / SSO ----
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: dxos-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      # Issuer của token luôn là KC_HOSTNAME dù APISIX gọi qua http://keycloak:8080 (backchannel động)
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_IOT_CLIENT_ID: ${KEYCLOAK_IOT_CLIENT_ID}
      KEYCLOAK_IOT_CLIENT_SECRET: ${KEYCLOAK_IOT_CLIENT_SECRET}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak/dxos-realm.json:/opt/keycloak/data/import/dxos-realm.json:ro
      - ./keycloak/themes/dxos:/opt/keycloak/themes/dxos:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT}:8080"
    healthcheck:
      # Image Keycloak không có curl: gọi HTTP thuần qua /dev/tcp của bash
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/${KEYCLOAK_REALM} HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - dxos-net

  # ---- Workflow Engine ----
  # Không publish cổng ra host: chỉ truy cập qua APISIX (JWT Keycloak).
  flowable:
    image: flowable/flowable-rest:7.0.1
    container_name: dxos-flowable
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${FLOWABLE_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_USER-ID: ${FLOWABLE_ADMIN_USER}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxos-net

  # ---- API Gateway (APISIX + etcd) ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: dxos-etcd
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dxos-net

  apisix:
    image: apache/apisix:3.9.0-debian
    container_name: dxos-apisix
    restart: unless-stopped
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY}
      APISIX_VIEWER_KEY: ${APISIX_VIEWER_KEY}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
      keycloak:
        condition: service_started
      flowable:
        condition: service_started
    ports:
      - "${APISIX_GATEWAY_PORT}:9080"
      - "127.0.0.1:${APISIX_ADMIN_PORT}:9180" # Admin API của APISIX chỉ máy chủ này
    networks:
      - dxos-net

  # ---- Tầng 3 (Nghiệp vụ): truy xuất nguồn gốc sản phẩm làng nghề ----
  # Không publish cổng ra host: chỉ truy cập qua APISIX (JWT Keycloak, trừ tuyến tra cứu công khai).
  trace-api:
    build: ./services/trace-api
    image: dxos/trace-api:local
    container_name: dxos-trace-api
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      TRACE_DB: ${TRACE_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${IOT_BUCKET:-dxos-iot}
      S3_ACCESS_KEY: ${TRACE_S3_USER}
      S3_SECRET_KEY: ${TRACE_S3_PASSWORD}
      IOT_DEVICES_FILE: /app/config/iot-devices.json
      ACCESS_FILE: /app/config/access.json
      OCOP_PROFILES_FILE: /app/config/ocop-profiles.json
      KILN_PROFILES_FILE: /app/config/kiln-profiles.json
      AUDIT_INGEST_KEY: ${AUDIT_INGEST_KEY}
      DOCS_BUCKET: ${DOCS_BUCKET:-dxos-docs}
      ARCHIVE_KEEP_DAYS: ${ARCHIVE_KEEP_DAYS:-90}
      ARCHIVE_INTERVAL_HOURS: ${ARCHIVE_INTERVAL_HOURS:-24}
      DOCS_S3_ACCESS_KEY: ${TRACE_DOCS_USER}
      DOCS_S3_SECRET_KEY: ${TRACE_DOCS_PASSWORD}
      FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      FLOWABLE_USER: ${FLOWABLE_ADMIN_USER}
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
    volumes:
      - ./config/iot-devices.json:/app/config/iot-devices.json:ro
      - ./config/access.json:/app/config/access.json:ro
      - ./config/ocop-profiles.json:/app/config/ocop-profiles.json:ro
      - ./config/kiln-profiles.json:/app/config/kiln-profiles.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      flowable:
        condition: service_started
    networks:
      - dxos-net
